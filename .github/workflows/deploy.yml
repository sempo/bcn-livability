name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Public, non-secret config lives in frontend/.env.production. Only client keys that must
        # reach the browser are injected here from repo secrets, keeping them out of git.
        # The TMB keys power the metro layer; if unset, the map still works, metro just won't load.
        env:
          VITE_TMB_APP_ID: ${{ secrets.VITE_TMB_APP_ID }}
          VITE_TMB_APP_KEY: ${{ secrets.VITE_TMB_APP_KEY }}
          # Only the upstream repo owns livability.time2map.com (base '/'). A fork is served from
          # https://<owner>.github.io/<repo>/, so its assets live under that subpath.
          VITE_BASE: ${{ github.repository == 'time2map/bcn-property-finder' && '/' || format('/{0}/', github.event.repository.name) }}
        run: |
          # The custom domain is claimed in the upstream repo's Pages settings, never by a fork's build.
          if [ "$GITHUB_REPOSITORY" != "time2map/bcn-property-finder" ]; then rm -f public/CNAME; fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
